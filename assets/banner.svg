<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Draven Garden</title>
  <desc id="desc">A dark gradient banner with abstract orbital lines and the words Draven Garden.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.55" stop-color="#312e81" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.7" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />

  <circle cx="1030" cy="90" r="110" fill="#5eead4" fill-opacity="0.16" filter="url(#blur)" />
  <circle cx="980" cy="230" r="130" fill="#a78bfa" fill-opacity="0.18" filter="url(#blur)" />

  <g fill="none" stroke-linecap="round">
    <path d="M 760 350 C 800 120 1010 35 1250 120" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="2" />
    <path d="M 700 330 C 790 110 1030 65 1270 185" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2" />
    <path d="M 820 340 C 850 180 1030 120 1200 150" stroke="#fff" stroke-opacity="0.22" stroke-width="1" />
    <path d="M 650 242 H 1080" stroke="url(#glow)" stroke-width="2" />
  </g>

  <g fill="#fff">
    <circle cx="875" cy="72" r="3" fill-opacity="0.8" />
    <circle cx="1060" cy="196" r="4" fill="#5eead4" />
    <circle cx="1130" cy="82" r="2" fill-opacity="0.6" />
  </g>

  <g fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="82" y="126" font-size="54" font-weight="750" letter-spacing="2">DRAVEN GARDEN</text>
    <text x="86" y="174" font-size="19" letter-spacing="5" fill="#c4b5fd">TOOLS · SYSTEMS · CURIOSITY</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" opacity="0.85">
    <path d="M 88 218 L 105 233 L 88 248" />
    <path d="M 132 248 H 178" />
    <path d="M 210 218 L 193 233 L 210 248" />
  </g>
</svg>
