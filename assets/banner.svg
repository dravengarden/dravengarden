<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Welcome to Draven Garden</title>
  <desc id="desc">A moonlit garden beneath a star-filled sky with a geometric Draven wordmark and the words Welcome to Draven Garden.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d25" />
      <stop offset="0.48" stop-color="#1d1b55" />
      <stop offset="1" stop-color="#124c58" />
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.32" />
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="1" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#185c5a" />
      <stop offset="1" stop-color="#061d2a" />
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173b4b" />
      <stop offset="1" stop-color="#0b2936" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.72" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="logoSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.52" stop-color="#d7d9e2" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="logoPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc" />
      <stop offset="0.52" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#5b21b6" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dbeafe" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#sky)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />

  <ellipse cx="1030" cy="92" rx="220" ry="145" fill="url(#nebula)" filter="url(#softGlow)" />
  <ellipse cx="840" cy="260" rx="260" ry="105" fill="#5eead4" fill-opacity="0.1" filter="url(#softGlow)" />

  <g fill="#fff7d6">
    <circle cx="695" cy="54" r="1.8" />
    <circle cx="755" cy="103" r="1.2" fill-opacity="0.7" />
    <circle cx="834" cy="45" r="1.4" />
    <circle cx="918" cy="82" r="2.2" />
    <circle cx="1048" cy="48" r="1.5" />
    <circle cx="1110" cy="113" r="1.2" fill-opacity="0.75" />
    <circle cx="1158" cy="61" r="1.8" />
    <circle cx="1000" cy="142" r="1.1" fill-opacity="0.65" />
    <circle cx="802" cy="153" r="1.3" fill-opacity="0.8" />
  </g>

  <g fill="#fef3c7" opacity="0.9">
    <path d="M 883 48 l 2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" />
    <path d="M 1088 145 l 1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5 z" />
  </g>

  <g fill="#fef3c7">
    <circle cx="1028" cy="73" r="26" />
    <circle cx="1040" cy="64" r="26" fill="#171749" />
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M 755 328 C 790 130 1005 37 1250 116" stroke="#c4b5fd" stroke-opacity="0.62" stroke-width="2" />
    <path d="M 690 330 C 780 118 1025 62 1270 182" stroke="#5eead4" stroke-opacity="0.48" stroke-width="2" />
    <path d="M 810 331 C 846 183 1035 120 1200 151" stroke="#e0e7ff" stroke-opacity="0.18" stroke-width="1" />
  </g>

  <path d="M 0 258 C 125 216 220 236 330 250 C 455 266 548 222 668 238 C 800 256 892 204 1014 221 C 1098 232 1150 220 1200 204 L 1200 300 L 0 300 Z" fill="url(#hill)" />
  <path d="M 0 276 C 126 246 225 266 342 274 C 470 283 562 249 675 261 C 806 274 920 235 1020 250 C 1104 263 1152 246 1200 236 L 1200 300 L 0 300 Z" fill="url(#meadow)" />

  <g fill="#0a2932" opacity="0.92">
    <path d="M 736 257 L 736 211 L 728 211 L 746 184 L 739 184 L 757 154 L 775 184 L 768 184 L 786 211 L 778 211 L 778 257 Z" />
    <path d="M 1136 255 L 1136 218 L 1128 218 L 1144 194 L 1138 194 L 1154 167 L 1170 194 L 1164 194 L 1180 218 L 1172 218 L 1172 255 Z" />
  </g>

  <g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 566 287 C 568 275 568 265 564 254" stroke-width="2" />
    <path d="M 568 274 C 558 268 554 263 553 256" stroke-width="2" />
    <path d="M 568 267 C 577 260 581 254 582 247" stroke-width="2" />
    <path d="M 640 293 C 642 281 642 271 638 260" stroke-width="2" />
    <path d="M 642 280 C 633 274 629 268 628 262" stroke-width="2" />
    <path d="M 642 273 C 652 267 655 260 656 254" stroke-width="2" />
  </g>

  <g fill="#f9a8d4">
    <circle cx="564" cy="253" r="3" />
    <circle cx="582" cy="247" r="3" />
    <circle cx="628" cy="261" r="3" />
    <circle cx="656" cy="253" r="3" />
  </g>

  <g fill="#fde68a" opacity="0.9" filter="url(#starGlow)">
    <circle cx="704" cy="236" r="3" />
    <circle cx="1092" cy="224" r="2.5" />
    <circle cx="1188" cy="197" r="2.5" />
  </g>

  <g transform="translate(82 72) scale(0.86)" fill="url(#logoSilver)" fill-rule="evenodd">
    <path d="M 0 0 H 73 L 101 23 V 49 L 73 72 H 0 Z M 17 16 V 56 H 66 L 84 42 V 30 L 66 16 Z" />
    <path d="M 122 0 H 180 L 205 20 V 35 L 181 53 H 158 L 207 72 H 177 L 143 51 V 72 H 122 Z M 143 16 V 36 H 174 L 185 28 V 26 L 174 16 Z" />
    <path d="M 225 72 L 263 0 L 301 72 H 279 L 263 37 L 247 72 Z" fill="url(#logoPurple)" />
    <path d="M 321 0 H 344 L 372 54 L 400 0 H 423 L 382 72 H 362 Z" />
    <path d="M 443 0 H 524 L 510 16 H 464 V 28 H 510 L 496 44 H 464 V 56 H 524 L 510 72 H 443 Z" />
    <path d="M 540 0 H 560 L 604 47 V 0 H 625 V 72 H 604 L 560 25 V 72 H 540 Z" />
  </g>

  <g fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="86" y="174" font-size="18" font-weight="650" letter-spacing="4">WELCOME TO DRAVEN GARDEN</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" opacity="0.85">
    <path d="M 88 218 L 105 233 L 88 248" />
    <path d="M 132 248 H 178" />
    <path d="M 210 218 L 193 233 L 210 248" />
  </g>
</svg>
